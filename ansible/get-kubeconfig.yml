---
- name: Download homelab administrator kubeconfig
  hosts: control_plane[0]
  gather_facts: false

  vars:
    local_kube_dir: "{{ lookup('ansible.builtin.env', 'HOME') }}/.kube"
    local_kubeconfig: "{{ local_kube_dir }}/homelab.yaml"

  tasks:
    - name: Create private local kubeconfig directory
      ansible.builtin.file:
        path: "{{ local_kube_dir }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"

    - name: Fetch administrator kubeconfig from control plane
      ansible.builtin.fetch:
        src: /etc/kubernetes/admin.conf
        dest: "{{ local_kubeconfig }}"
        flat: true
      become: true
      no_log: true

    - name: Restrict local kubeconfig permissions
      ansible.builtin.file:
        path: "{{ local_kubeconfig }}"
        mode: "0600"
      delegate_to: localhost
      become: false
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
