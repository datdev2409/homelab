---
- name: Download homelab administrator kubeconfig
  hosts: control_plane[0]
  gather_facts: false

  vars:
    # Inventory layout: <repository>/ansible/inventory/<cluster-id>/inventory.yml.
    cluster_id: "{{ inventory_dir | basename }}"
    local_kube_dir: "{{ inventory_dir | dirname | dirname | dirname }}/.local/config/{{ cluster_id }}"
    local_kubeconfig: "{{ local_kube_dir }}/kubeconfig.yaml"

  tasks:
    - name: Create private local kubeconfig directory
      ansible.builtin.file:
        path: "{{ local_kube_dir }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"

    - name: Fetch administrator kubeconfig from control plane
      ansible.builtin.fetch:
        src: /etc/kubernetes/admin.conf
        dest: "{{ local_kubeconfig }}"
        flat: true
      become: true
      no_log: true

    - name: Restrict local kubeconfig permissions
      ansible.builtin.file:
        path: "{{ local_kubeconfig }}"
        mode: "0600"
      delegate_to: localhost
      become: false
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
