---
- name: Download homelab administrator kubeconfig
  hosts: control_plane[0]
  gather_facts: false

  vars:
    # Inventory layout: <repository>/ansible/inventory/<cluster-id>/inventory.yml.
    remote_kubeconfig: /etc/rancher/k3s/k3s.yaml
    cluster_id: "{{ inventory_dir | basename }}"
    local_kube_dir: "{{ inventory_dir | dirname | dirname | dirname }}/.local/config/{{ cluster_id }}"
    local_kubeconfig: "{{ local_kube_dir }}/kubeconfig.yaml"

  tasks:
    - name: Create private local kubeconfig directory
      ansible.builtin.file:
        path: "{{ local_kube_dir }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"

    - name: Read administrator kubeconfig from control plane
      ansible.builtin.slurp:
        src: "{{ remote_kubeconfig }}"
      register: administrator_kubeconfig
      become: true
      no_log: true
      when: not ansible_check_mode

    - name: Write private kubeconfig with the reachable API endpoint
      ansible.builtin.copy:
        content: "{{ (administrator_kubeconfig.content | b64decode) | replace('https://127.0.0.1:6443', 'https://' ~ hostvars[inventory_hostname]['ansible_host'] ~ ':6443') }}"
        dest: "{{ local_kubeconfig }}"
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true
      diff: false
      when: not ansible_check_mode
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
