apiVersion: v1
kind: Service
metadata:
  name: traefik-nodeport-svc
  namespace: traefik
  annotations:
    metallb.io/address-pool: lan
    metallb.io/loadBalancerIPs: "192.168.1.30"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/instance: traefik-traefik
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
      nodePort: 30080
    - name: https
      protocol: TCP
      port: 443
      targetPort: 8443
      nodePort: 30443
