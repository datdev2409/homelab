apiVersion: v1
kind: Service
metadata:
  name: traefik-nodeport-svc
  namespace: traefik
spec:
  selector:
    app.kubernetes.io/instance=traefik-traefik
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
    - protocol: TCP
      port: 443
      targetPort: 443
      nodePort: 30443
