apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
  - repoURL: quay.io/jetstack/charts
    chart: cert-manager
    targetRevision: "v1.21.2"
    helm:
      releaseName: cert-manager
      valueFiles:
      - $values/apps/cert-manager/values.yaml
      - $values/apps/cert-manager/override/001/values.yaml
  - repoURL: https://github.com/datdev2409/homelab.git
    targetRevision: main
    ref: values
  - repoURL: https://github.com/datdev2409/homelab.git
    targetRevision: main
    path: apps/cert-manager/extra
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
