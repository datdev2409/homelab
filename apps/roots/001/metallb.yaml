apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
  - repoURL: https://metallb.github.io/metallb
    chart: metallb
    targetRevision: "0.16.1"
    helm:
      releaseName: metallb
      valueFiles:
      - $values/apps/metallb/values.yaml
      - $values/apps/metallb/override/001/values.yaml
  - repoURL: https://github.com/datdev2409/homelab.git
    targetRevision: main
    ref: values
  - repoURL: https://github.com/datdev2409/homelab.git
    targetRevision: main
    path: apps/metallb/override/001/extra
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: privileged
        pod-security.kubernetes.io/warn: privileged
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
