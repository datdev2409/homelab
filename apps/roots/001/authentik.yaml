apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
  - repoURL: https://charts.goauthentik.io
    chart: authentik
    targetRevision: "2026.8.5"
    helm:
      releaseName: authentik
      valueFiles:
      - $values/apps/authentik/values.yaml
      - $values/apps/authentik/override/001/values.yaml
  - repoURL: https://github.com/datdev2409/homelab.git
    targetRevision: main
    ref: values
  - repoURL: https://github.com/datdev2409/homelab.git
    targetRevision: main
    path: apps/authentik/extra
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: authentik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
