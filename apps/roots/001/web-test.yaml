apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web-test
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/datdev2409/homelab.git
    targetRevision: main
    path: apps/web-test/overlays/001
  destination:
    server: https://kubernetes.default.svc
    namespace: web-test
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
