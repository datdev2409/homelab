apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflared
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
  - repoURL: https://repo.helmforge.dev
    chart: cloudflared
    targetRevision: "1.5.17"
    helm:
      releaseName: cloudflared
      valueFiles:
      - $values/apps/cloudflared/values.yaml
      - $values/apps/cloudflared/override/001/values.yaml
  - repoURL: https://github.com/datdev2409/homelab.git
    targetRevision: main
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudflare
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
