apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: monitoring
  sources:
  - repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: "29.37.2"
    helm:
      releaseName: prometheus
      valueFiles:
      - $values/apps/prometheus/values.yaml
  - repoURL: https://github.com/datdev2409/homelab.git
    targetRevision: main
    ref: values
  - repoURL: https://github.com/datdev2409/homelab.git
    targetRevision: main
    path: apps/prometheus/extra
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: prometheus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
