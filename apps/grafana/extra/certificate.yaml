apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-ingress-certificate
  namespace: grafana
spec:
  secretName: grafana-ingress-tls
  dnsNames:
  - grafana.datnguyen.me
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io
