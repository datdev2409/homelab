apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-test
  annotations:
    # Traefik's publishedService is disabled; verify routing directly.
    argocd.argoproj.io/ignore-healthcheck: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - test.datnguyen.me
    secretName: web-test-tls
  rules:
  - host: test.datnguyen.me
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-test
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-test-http
  annotations:
    # Routing is verified through the tunnel and direct Traefik requests.
    argocd.argoproj.io/ignore-healthcheck: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
  - host: test.datnguyen.me
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-test
            port:
              number: 80
