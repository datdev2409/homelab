apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: web-test
spec:
  secretName: web-test-tls
  dnsNames:
  - test.datnguyen.me
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
