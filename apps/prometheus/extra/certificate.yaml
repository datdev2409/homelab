apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: prometheus-ingress-certificate
  namespace: prometheus
spec:
  secretName: prometheus-server-tls
  dnsNames:
  - prometheus.datnguyen.me
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io
