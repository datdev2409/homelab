apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: home-apra-ca-bootstrap
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: home-apra-root-ca
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  isCA: true
  commonName: Homelab home.apra Root CA
  subject:
    organizations:
    - Homelab
  secretName: home-apra-root-ca
  duration: 87600h
  renewBefore: 8760h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never
  issuerRef:
    name: home-apra-ca-bootstrap
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: home-apra-ca
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  ca:
    secretName: home-apra-root-ca
